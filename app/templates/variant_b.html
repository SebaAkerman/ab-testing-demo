<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Widget — Limited Offer!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 480px; padding: 40px; text-align: center; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .tagline { font-size: 1rem; color: #e53935; font-weight: bold; margin-bottom: 12px; }
    .price { font-size: 1.5rem; color: #333; margin-bottom: 16px; }
    .description { color: #555; margin-bottom: 16px; line-height: 1.5; }
    .testimonial { font-style: italic; background: #f9f9f9; border-left: 3px solid #4caf50; padding: 10px 16px; margin-bottom: 20px; color: #555; font-size: 0.9rem; }
    .stock { color: #e53935; font-weight: bold; margin-bottom: 20px; }
    .btn { display: inline-block; padding: 16px 44px; background: #2e7d32; color: #fff; font-size: 1.15rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #1b5e20; }
    .variant-badge { margin-top: 24px; font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Super Widget</h1>
    <div class="tagline">⭐ #1 Bestseller — Limited Time Offer!</div>
    <div class="price">$29.99</div>
    <p class="description">Join thousands of happy customers. Our award-winning widget transforms your workflow in minutes.</p>
    <div class="testimonial">"Best purchase I made this year. Worth every penny!" — María G.</div>
    <div class="stock">Only 3 left in stock — order now!</div>
    <form method="POST" action="/buy">
      <button class="btn" type="submit">Buy Now — Limited Offer!</button>
    </form>
    <div class="variant-badge">Variant B</div>
  </div>
</body>
</html>
